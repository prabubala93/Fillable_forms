<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Individual Personal Accident \u2013 Proposal Form | UIIC Forms</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toolbar">
    <a href="index.html">&larr; All Forms</a>
    <div class="spacer"></div>
    <span class="pdf-status" id="pdfStatus"></span>
    <button id="downloadBtn">Download as PDF</button>
  </div>

  <div class="paper-wrap"><div id="formRoot"></div></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="core.js"></script>
  <script>
    const root = document.getElementById('formRoot');
    const U = UIIC;

    root.appendChild(U.letterhead());
    root.appendChild(U.titleBlock('Proposal Form for Individual Personal Accident Insurance', '(For Sum Insured exceeding \u20b91 lakh)'));

    let b = U.block('1\u20134. Proposer & Insured Details');
    b.appendChild(U.grid([
      U.field('1a. Name of the Proposer', { width: 'half' }),
      U.field('1b. Name of the Insured Person', { width: 'half' }),
      U.field('1c. Relation between Proposer and Insured Person', { width: 'full' }),
      U.field('2. Residential / Permanent Address', { width: 'full', type: 'textarea' }),
      U.field('3. Address for Correspondence', { width: 'full', type: 'textarea' }),
      U.field('4a. Profession, Occupation, Trade or Business (nature of duties)', { width: 'full', type: 'textarea' }),
    ]));
    b.appendChild(U.checkGroup('4b. Are you primarily engaged in administrative duties?', ['Yes', 'No'], { width: 'full' }));
    b.appendChild(U.checkGroup('4c. Does your occupation require manual / hazardous work?', ['Yes', 'No'], { width: 'full' }));
    b.appendChild(U.el('div', { class: 'block-note', text: '4d. Do you engage in:' }));
    b.appendChild(U.checkGroup('', ['Racing on Wheels or Horseback', 'Big Game Hunting', 'Mountaineering', 'Winter Sports, Skiing or Ice Hockey', 'Ballooning, Polo or Similar Sports'], { width: 'full' }));
    b.appendChild(U.grid([
      U.field('4e(i). Average Monthly Income \u2014 Gainful Employment (\u20b9)', { width: 'half' }),
      U.field('4e(ii). Average Monthly Income \u2014 Other Sources (\u20b9)', { width: 'half' }),
      U.field('Total Monthly Income (\u20b9)', { width: 'half' }),
      U.field('5. Date of Birth', { type: 'date', width: 'third' }),
      U.field('Height (m)', { width: 'third' }),
      U.field('Weight (kg)', { width: 'third' }),
    ]));
    root.appendChild(b);

    b = U.block('6. Health Declaration', 'Please give full particulars if the answer is \u2018Yes\u2019 to any of the following.');
    b.appendChild(U.checkGroup('Any physical defect or infirmity?', ['Yes', 'No'], { width: 'full' }));
    b.appendChild(U.checkGroup('a. Gout, Arthritis, Diabetes, Paralysis, Fits or any chronic disease?', ['Yes', 'No'], { width: 'full' }));
    b.appendChild(U.checkGroup('b. Any other disability?', ['Yes', 'No'], { width: 'full' }));
    b.appendChild(U.field('Details (if any answer is \u2018Yes\u2019)', { width: 'full', type: 'textarea' }));
    root.appendChild(b);

    b = U.block('7. Insurance History');
    b.appendChild(U.checkGroup('a. Have you ever proposed for Accident and/or Life Insurance?', ['Yes', 'No'], { width: 'full' }));
    b.appendChild(U.field('b. Name of each Company and amount of Insurance', { width: 'full', type: 'textarea' }));
    b.appendChild(U.el('div', { class: 'block-note', text: 'c. Has any Company:' }));
    b.appendChild(U.checkGroup('i. Declined to issue a policy to you?', ['Yes', 'No'], { width: 'full' }));
    b.appendChild(U.checkGroup('ii. Declined to continue your Insurance?', ['Yes', 'No'], { width: 'full' }));
    b.appendChild(U.checkGroup('iii. Not invited the renewal of your Policy?', ['Yes', 'No'], { width: 'full' }));
    b.appendChild(U.checkGroup('iv. Imposed any restriction or special conditions?', ['Yes', 'No'], { width: 'full' }));
    b.appendChild(U.field('If \u2018Yes\u2019 to any of i\u2013iv, give name and address of each Company', { width: 'full', type: 'textarea' }));
    b.appendChild(U.checkGroup('d. Is this insurance additional to any other Accident Policy or Employee Scheme?', ['Yes', 'No'], { width: 'full' }));
    b.appendChild(U.grid([
      U.field('If so \u2014 i. Name of Company', { width: 'third' }),
      U.field('ii. Sum Insured', { width: 'third' }),
      U.field('iii. Policy No.', { width: 'third' }),
    ]));
    root.appendChild(b);

    b = U.block('8. Claims History');
    b.appendChild(U.checkGroup('Have you ever claimed / received compensation under any Accident Policy?', ['Yes', 'No'], { width: 'full' }));
    b.appendChild(U.field('If so, give full particulars \u2014 name of insurer, amount and dates', { width: 'full', type: 'textarea' }));
    root.appendChild(b);

    b = U.block('9. Premium & Cover Details');
    b.appendChild(U.grid([
      U.field('a. Capital Sum Insured (\u20b9)', { width: 'third' }),
      U.field('b. Table of Cover / Benefit', { width: 'third' }),
      U.field('c. Period of Insurance \u2014 From', { type: 'date', width: 'third' }),
      U.field('Period of Insurance \u2014 To', { type: 'date', width: 'third' }),
    ]));
    root.appendChild(b);

    b = U.block('10. Additional Risks');
    b.appendChild(U.checkGroup('Do you wish to obtain cover against additional risks mentioned under extension cover?', ['Yes', 'No'], { width: 'full' }));
    b.appendChild(U.field('If yes, specify which', { width: 'full' }));
    root.appendChild(b);

    b = U.block('11. Family Package Cover');
    b.appendChild(U.el('div', { class: 'block-note', text: 'A. Insured Persons (members of the family to be covered, other than the insured)' }));
    b.appendChild(U.table({
      headers: ['Member', 'Age', 'Profession / Occupation', 'Annual Income', 'CSI', 'Table of Benefits'],
      rows: [
        ['1. Spouse', { input: true }, { input: true }, { input: true }, { input: true }, { input: true }],
        ['2. Child 1', { input: true }, { input: true }, { input: true }, { input: true }, { input: true }],
        ['Child 2', { input: true }, { input: true }, { input: true }, { input: true }, { input: true }],
        ['Child 3', { input: true }, { input: true }, { input: true }, { input: true }, { input: true }],
      ]
    }));
    b.appendChild(U.checkGroup('B. Medical Expenses (due to accident) to be covered?', ['Yes', 'No'], { width: 'full' }));
    root.appendChild(b);

    b = U.block('Declaration');
    b.appendChild(U.el('div', { class: 'legal', text: 'I declare that the above answers are true to the best of my knowledge and belief, that I have disclosed all particulars affecting assessment of the risk. I agree that this proposal and declaration shall be the basis of the contract between me and this Company.' }));
    b.appendChild(U.grid([
      U.field('Date', { type: 'date', width: 'third' }),
      U.field('Place', { width: 'third' })
    ]));
    b.appendChild(U.el('div', { class: 'sig-row' }, [
      U.signaturePad('Proposer\u2019s Signature'),
      U.signaturePad('Signature of the Person to be Insured')
    ]));
    root.appendChild(b);

    b = U.block('Assignment (if applicable)');
    b.appendChild(U.field('I ___________________ do hereby assign the monies payable by the Company, in the event of my death, to (Name & Relationship to the Insured):', { width: 'full' }));
    b.appendChild(U.grid([
      U.field('Dated this day of', { width: 'half' }),
      U.field('At', { width: 'half' }),
    ]));
    b.appendChild(U.el('div', { class: 'sig-row' }, [
      U.signaturePad('Witness \u2014 Name & Address / Signature'),
      U.signaturePad('Signature of the Policyholder')
    ]));
    root.appendChild(b);

    b = U.block('Statutory Warning');
    b.appendChild(U.statutoryWarningBlock());
    root.appendChild(b);

    root.appendChild(U.footer('Individual Personal Accident Insurance \u2013 Proposal Form', ''));

    U.bindToolbar('formRoot', 'Personal-Accident-Proposal-Form.pdf', 'pdfStatus');
  </script>
</body>
</html>
