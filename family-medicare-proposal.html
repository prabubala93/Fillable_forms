<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Medicare Policy \u2013 Proposal Form | UIIC Forms</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toolbar">
    <a href="index.html">&larr; All Forms</a>
    <div class="spacer"></div>
    <span class="pdf-status" id="pdfStatus"></span>
    <button id="downloadBtn">Download as PDF</button>
  </div>

  <div class="paper-wrap"><div id="formRoot"></div></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="core.js"></script>
  <script>
    const root = document.getElementById('formRoot');
    const U = UIIC;

    root.appendChild(U.letterhead());
    root.appendChild(U.titleBlock('Family Medicare Policy', 'Proposal Form', 'UIIC/FMP/24-25/1'));
    root.appendChild(U.instructions([
      'This Proposal Form is the basis of the policy to be issued. Provide all information fully & accurately \u2014 do not leave any space blank or put dashes.',
      'The Company is not at risk until the Proposal is accepted and acceptance is communicated in writing after payment of the requisite premium.',
      'Details of up to 6 Insured Persons can be filled in this form; use a fresh form for additional members.',
      'Pre-policy health check-up reports not older than 30 days must be submitted where required at the Company\u2019s discretion.',
      'A person porting from another insurer must complete Annexure C (Portability Form) along with this Proposal Form and Annexure A/B (if required).'
    ]));

    let b = U.block('I. Proposer Details', 'Submit a copy of Aadhaar / Passport / Election Photo ID / Latest Electricity Bill / Bank Passbook as Proof of Address');
    b.appendChild(U.grid([
      U.field('Name', { width: 'full' }),
      U.field('Date of Birth', { type: 'date', width: 'third' }),
      U.checkGroup('Gender', ['Male', 'Female', 'Other'], { width: 'third' }),
      U.checkGroup('Marital Status', ['Single', 'Married'], { width: 'third' }),
      U.checkGroup('Occupation', ['Salaried', 'Self-Employed', 'Others'], { width: 'half' }),
      U.field('If Others, specify', { width: 'half' }),
      U.field('PAN (or Form 60/61)', { width: 'third' }),
      U.field('Aadhaar Card / Passport No.', { width: 'third' }),
      U.field('E-Insurance Account No. (if available)', { width: 'third' }),
      U.field('Present Address', { width: 'full' }),
      U.field('City', { width: 'third' }), U.field('State', { width: 'third' }), U.field('Pin Code', { width: 'third' }),
      U.field('Permanent Address', { width: 'full' }),
      U.field('City', { width: 'third' }), U.field('State', { width: 'third' }), U.field('Pin Code', { width: 'third' }),
      U.field('Tel. No.', { width: 'third' }), U.field('Email ID', { type: 'email', width: 'third' }), U.field('Mobile', { width: 'third' }),
    ]));
    root.appendChild(b);

    b = U.block('II. Nomination', 'Where the Nominee is a minor, give the details of the Appointee. Nominee below is for the 1st Insured; for other members, the 1st Insured is deemed the Nominee.');
    b.appendChild(U.grid([
      U.field('Nominee Name', { width: 'half' }),
      U.field('Nominee Relationship with Proposer', { width: 'half' }),
      U.field('Present Address', { width: 'full' }),
      U.field('Permanent Address', { width: 'full' }),
      U.field('Bank A/c Number and IFSC', { width: 'half' }),
      U.field('Email ID', { type: 'email', width: 'quarter' }),
      U.field('Mobile', { width: 'quarter' }),
    ]));
    root.appendChild(b);

    b = U.block('III. Coverage Details');
    b.appendChild(U.grid([
      U.checkGroup('Policy Type', ['Individual Sum Insured Basis', 'Family Floater'], { width: 'half' }),
      U.field('TPA Preference', { width: 'half' }),
      U.field('Coverage required from', { type: 'date', width: 'half' }),
      U.field('to midnight of', { type: 'date', width: 'half' }),
    ]));
    b.appendChild(U.checkGroup('Sum Insured Options', ['3 Lakhs', '4 Lakhs', '5 Lakhs', '6 Lakhs', '7 Lakhs', '8 Lakhs', '9 Lakhs', '10 Lakhs', '15 Lakhs', '20 Lakhs', '25 Lakhs'], { width: 'full' }));
    b.appendChild(U.grid([
      U.checkGroup('Daily Cash Allowance (Opt.)', ['Yes', 'No'], { width: 'half' }),
      U.checkGroup('Maternity Expenses & New Born Baby Cover (Opt.)', ['Yes', 'No'], { width: 'half' }),
    ]));
    root.appendChild(b);

    b = U.block('IV. Insured Person(s) Details', 'Paste one stamp-size photograph and sign below. For a minor, the guardian or proposer may sign.');
    b.appendChild(U.photoSignatureRow());
    b.appendChild(U.insuredPersonsTable({ abha: true }));
    b.appendChild(U.el('div', { class: 'block-note', text: 'ABHA Creation Declaration: I/we consent to usage of my/our Aadhaar Number(s) by UIIC for creation of ABHA number(s) through the National Health Authority (NHA).' }));
    b.appendChild(U.checkGroup('ABHA Consent', ['Yes', 'No'], { width: 'full' }));
    root.appendChild(b);

    b = U.block('V. Existing Health Cover Information');
    b.appendChild(U.checkGroup('Does any person proposed to be insured presently hold a health insurance policy from any insurer (including UIIC)?', ['Yes', 'No'], { width: 'full' }));
    b.appendChild(U.existingCoverTable());
    b.appendChild(U.el('div', { class: 'block-note', text: 'Fill Annexure C if porting from another insurer. Continuity of benefits will NOT be considered unless the above is answered affirmatively with details, Annexure C and supporting documents submitted.' }));
    root.appendChild(b);

    b = U.block('VI. Medical Information');
    b.appendChild(U.medicalInformationBlock());
    root.appendChild(b);

    b = U.block('Past Proposals');
    b.appendChild(U.pastProposalsAndPayment());
    root.appendChild(b);

    b = U.block('VII. Payment Details');
    b.appendChild(U.paymentDetailsBlock());
    root.appendChild(b);

    b = U.block('VIII. Bank Details for Processing of Refund');
    b.appendChild(U.bankRefundBlock());
    root.appendChild(b);

    b = U.block('IX. Declarations');
    b.appendChild(U.proposerDeclarationBlock());
    root.appendChild(b);

    b = U.block('X. Certificate from Proposer (form not filled by proposer / vernacular / illiterate)');
    b.appendChild(U.illiterateProposerCertificate());
    root.appendChild(b);

    b = U.block('XI. Declaration of the Intermediary');
    b.appendChild(U.intermediaryDeclarationBlock());
    root.appendChild(b);

    b = U.block('XII. Statutory Warning');
    b.appendChild(U.statutoryWarningBlock());
    root.appendChild(b);

    b = U.block('XIII. Office Use Only');
    b.appendChild(U.officeUseBlock());
    root.appendChild(b);

    root.appendChild(U.footer('Family Medicare Policy \u2013 Proposal Form', 'UIIC/FMP/24-25/1'));

    U.bindToolbar('formRoot', 'Family-Medicare-Proposal-Form.pdf', 'pdfStatus');
  </script>
</body>
</html>
